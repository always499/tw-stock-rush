  <style>
    *{box-sizing:border-box}body{margin:0;color:#17201c;background:#f4f1e9;background-image:linear-gradient(#076b520b 1px,transparent 1px),linear-gradient(90deg,#076b520b 1px,transparent 1px);background-size:28px 28px;font-family:system-ui,"Noto Sans TC",sans-serif}.ticker{height:34px;overflow:hidden;background:#14231d;color:#d8e3dd;font-size:12px;font-weight:700;white-space:nowrap;display:flex;align-items:center}.ticker div{min-width:max-content;animation:tick 22s linear infinite;padding-left:100%}.ticker b{color:#56d5a9;margin:0 34px 0 8px}@keyframes tick{to{transform:translateX(-100%)}}.wrap{width:min(1120px,calc(100% - 40px));min-height:calc(100vh - 34px);margin:auto;display:flex;flex-direction:column;padding:28px 0 18px}header{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#086b52;color:white;font-size:22px;box-shadow:inset 0 -3px #0003;transform:rotate(-3deg)}.brand strong{font-size:23px;letter-spacing:-1px}.brand small{display:block;color:#747b76;font-size:10px;letter-spacing:2px}.best{background:#fffdf8cc;border:1px solid #d9d5ca;border-radius:12px;padding:9px 13px;font-size:13px;box-shadow:0 3px #17201c10}.best b{font-size:16px;margin-left:5px}.welcome{display:grid;grid-template-columns:.88fr 1.12fr;align-items:center;gap:8vw;flex:1;padding:7vh 3vw}.tag{display:inline-block;border-radius:99px;padding:6px 12px;background:#d8f2e9;color:#075a46;font-size:12px;font-weight:800}.copy h1{font-size:clamp(52px,7vw,102px);line-height:.91;letter-spacing:-.075em;margin:20px 0 26px;font-weight:900}.copy h1 span{color:#087257}.copy p{color:#6f766f;font-size:17px;line-height:1.8;max-width:520px}.primary{border:0;background:#076b52;color:#fff;border-radius:13px;padding:15px 23px;font-size:16px;font-weight:900;box-shadow:0 5px #064c3c;cursor:pointer;margin-top:20px}.primary:hover{transform:translateY(-2px);box-shadow:0 7px #064c3c}.demo,.card{background:#fffdf8;border:1px solid #cdc8bc;border-radius:24px;padding:32px;box-shadow:12px 14px #d8d3c6,0 30px 80px #273b321f}.demo{transform:rotate(1.5deg)}.demo-top,.meta,.qcount,.scoreline{display:flex;justify-content:space-between;align-items:center}.demo-top{font-size:12px;font-weight:900;color:#68716c}.demo-q{text-align:center;padding:58px 0 40px;font-size:23px;font-weight:900}.opts,.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.opts span{height:52px;display:grid;place-items:center;border:1px solid #d8d3c6;background:white;border-radius:12px;font-weight:900}.opts .right{background:#0b775b;color:white}.rules{border-top:1px dashed #d3cec2;margin-top:24px;padding-top:18px;display:flex;justify-content:center;gap:18px;color:#6f766f;font-size:11px;font-weight:700;flex-wrap:wrap}.game{width:min(900px,100%);margin:auto;flex:1;padding:5vh 0 3vh}.levels{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:0 auto 26px;max-width:720px}.levels:before{content:"";height:2px;background:#d1cec5;position:absolute;left:10%;right:10%;top:17px}.node{position:relative;text-align:center;color:#9ba19c;font-size:11px}.node i{font-style:normal;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#e1ded5;border:2px solid #f4f1e9;font-weight:900}.node small{display:block;margin-top:7px;font-weight:800}.node.done i{background:#7acdb3;color:#07543f}.node.active{color:#075f49}.node.active i{background:#076b52;color:#fff;box-shadow:0 0 0 5px #cfe8df}.card{box-shadow:0 18px 60px #1c30271f;min-height:580px;padding:38px}.meta h2{margin:7px 0 0;font-size:28px}.timer{display:flex;gap:6px;align-items:baseline;color:#087057;background:#e5f2ed;border-radius:13px;padding:10px 14px}.timer b{font-size:26px}.timer.danger{color:#c7433c;background:#fde8e5;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.06)}}.bar{height:7px;background:#e6e2d9;border-radius:99px;overflow:hidden;margin:18px 0 25px}.bar i{display:block;height:100%;background:#0b8061;transition:width .4s linear}.qcount{font-size:12px;color:#737a75;font-weight:800;gap:12px}.prompt{text-align:center;padding:30px 0 28px}.prompt p{color:#747b76;margin:0}.prompt b{display:block;font-size:clamp(44px,7vw,65px);letter-spacing:-3px;margin:6px}.prompt small{background:#eeece6;border-radius:99px;padding:4px 9px;color:#777d79}.answers button{min-height:66px;border:1px solid #d6d2c8;background:#fff;border-radius:13px;display:grid;grid-template-columns:30px 1fr 30px;align-items:center;padding:8px 14px;font-size:18px;font-weight:900;cursor:pointer}.answers button:hover:not(:disabled){border-color:#138063;transform:translateY(-2px);box-shadow:0 4px #c9ded6}.answers kbd{width:26px;height:26px;border-radius:7px;background:#efede7;display:grid;place-items:center;font-size:11px;color:#777}.answers .correct{background:#dff3eb;border-color:#138063;color:#086249}.answers .wrong{background:#fde7e5;border-color:#d94b4b;color:#b43735}.typing{display:flex;gap:12px;max-width:520px;margin:auto}.typing input{width:100%;height:64px;border:1px solid #cfcabd;border-radius:13px;background:#fff;font-size:24px;font-weight:900;text-align:center;padding:0 16px;color:#17201c}.typing input:focus{outline:4px solid #d5eee5;border-color:#087057}.typing button{min-width:118px;margin:0}.answer-reveal{margin-top:14px;color:#777d79;font-size:13px;font-weight:800}.scoreline{border-top:1px dashed #d5d0c5;margin-top:24px;padding-top:18px;color:#6d746f;font-size:13px}.scoreline strong{font-size:22px;color:#17201c}.result{min-height:450px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.result .icon{width:70px;height:70px;border-radius:22px;background:#d9f2e9;color:#087057;display:grid;place-items:center;font-size:32px;margin-bottom:20px}.result h2{font-size:clamp(30px,4vw,42px);letter-spacing:-2px;margin:15px 0 7px}.result p{color:#777e79}.stats{display:flex;gap:35px;margin:23px}.stats span{font-size:11px;color:#7d837f}.stats b{display:block;font-size:25px;color:#1c2923}footer{display:flex;justify-content:space-between;border-top:1px solid #585f5a26;padding-top:12px;color:#858a85;font-size:10px}.hide{display:none!important}
    @media(max-width:760px){.welcome{grid-template-columns:1fr;padding:7vh 0 5vh}.demo{transform:none}.copy h1{font-size:clamp(50px,15vw,82px)}.answers{grid-template-columns:1fr}.typing{flex-direction:column}.typing button{width:100%}.node small{display:none}.card{padding:22px 16px}.prompt{padding:24px 0}.ticker div{animation-duration:17s}}@media(max-width:480px){.demo{padding:18px}.brand strong{font-size:20px}.best span{display:none}.game{padding-top:4vh}.stats{gap:18px}footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ticker div{padding-left:20px}}
  </style>
</head>
<body>
  <div class="ticker"><div>TAIEX <b>▲ 1.28%</b>2330 台積電 <b>▲ 15</b>2454 聯發科 <b>▲ 2.06%</b>2317 鴻海 <b>▲ 1.44%</b></div></div>
  <div class="wrap">
    <header><div class="brand"><div class="logo">ϟ</div><div><strong>股號衝刺班</strong><small>TAIWAN STOCK RUSH</small></div></div><div class="best">🏆 <span>最佳</span> <b id="best">0</b></div></header>
    <section id="welcome" class="welcome"><div class="copy"><span class="tag">高難度版・第 5 關輸入決戰</span><h1>你認得幾檔<br><span>台灣好股票？</span></h1><p>前兩關熱身，第三關開始同產業干擾且不再給提示。最後一關沒有選項，直接輸入股票代號或公司名。</p><button class="primary" onclick="startGame()">開始闖關　→</button></div><div class="demo"><div class="demo-top"><span>LEVEL 05</span><span>◷ 8 秒 / 題</span></div><div class="demo-q">「台積電」的股票代號是？</div><div class="typing"><input value="2330" readonly><button class="primary">送出 ✓</button></div><div class="rules"><span>🔥 同業干擾</span><span>◷ 答錯扣 5 秒</span><span>⌨ 封關輸入題</span></div></div></section>
    <section id="game" class="game hide"><div id="levels" class="levels"></div><div class="card"><div class="meta"><div><span id="levelTag" class="tag"></span><h2 id="levelTitle"></h2></div><div id="timer" class="timer">◷ <b id="time">35</b><span>秒</span></div></div><div class="bar"><i id="bar"></i></div><div id="play"><div class="qcount"><span id="qnum"></span><span id="target"></span></div><div class="prompt"><p id="instruction"></p><b id="prompt"></b><small id="industry"></small><div id="reveal" class="answer-reveal hide"></div></div><div id="answers" class="answers"></div><div class="scoreline"><span>🔥 連擊 <b id="combo">×0</b></span><strong><span id="score">0</span> <small>PTS</small></strong></div></div><div id="result" class="result hide"></div></div></section>
    <footer><span>純屬學習遊戲，不構成投資建議</span><span>題庫：臺灣常見上市櫃公司，含同業干擾與輸入題</span></footer>
  </div>
  <script>
    const stocks=[['2330','台積電','台灣積體電路製造股份有限公司','半導體'],['2317','鴻海','鴻海精密工業股份有限公司','其他電子'],['2454','聯發科','聯發科技股份有限公司','半導體'],['2308','台達電','台達電子工業股份有限公司','電子零組件'],['2382','廣達','廣達電腦股份有限公司','電腦及週邊'],['2303','聯電','聯華電子股份有限公司','半導體'],['2412','中華電','中華電信股份有限公司','通信網路'],['1301','台塑','台灣塑膠工業股份有限公司','塑膠'],['1303','南亞','南亞塑膠工業股份有限公司','塑膠'],['2002','中鋼','中國鋼鐵股份有限公司','鋼鐵'],['1216','統一','統一企業股份有限公司','食品'],['2207','和泰車','和泰汽車股份有限公司','汽車'],['2603','長榮','長榮海運股份有限公司','航運'],['2615','萬海','萬海航運股份有限公司','航運'],['2609','陽明','陽明海運股份有限公司','航運'],['2881','富邦金','富邦金融控股股份有限公司','金融保險'],['2882','國泰金','國泰金融控股股份有限公司','金融保險'],['2884','玉山金','玉山金融控股股份有限公司','金融保險'],['2886','兆豐金','兆豐金融控股股份有限公司','金融保險'],['2891','中信金','中國信託金融控股股份有限公司','金融保險'],['2892','第一金','第一金融控股股份有限公司','金融保險'],['2885','元大金','元大金融控股股份有限公司','金融保險'],['2327','國巨','國巨股份有限公司','電子零組件'],['2379','瑞昱','瑞昱半導體股份有限公司','半導體'],['3034','聯詠','聯詠科技股份有限公司','半導體'],['3711','日月光投控','日月光投資控股股份有限公司','半導體'],['2357','華碩','華碩電腦股份有限公司','電腦及週邊'],['2345','智邦','智邦科技股份有限公司','通信網路'],['3045','台灣大','台灣大哥大股份有限公司','通信網路'],['4904','遠傳','遠傳電信股份有限公司','通信網路']];
    const levels=[{name:'新手試單',mode:'暖身',time:35,need:3,penalty:3,same:false,hint:true,input:false},{name:'盤中追價',mode:'加速',time:30,need:3,penalty:3,same:false,hint:true,input:false},{name:'法人交鋒',mode:'同業干擾',time:26,need:4,penalty:4,same:true,hint:false,input:false},{name:'主力洗盤',mode:'無提示快攻',time:22,need:4,penalty:5,same:true,hint:false,input:false},{name:'封關決戰',mode:'輸入題',time:8,need:4,penalty:0,same:true,hint:false,input:true}];
    let level=0,questions=[],qi=0,time=35,score=0,combo=0,correct=0,total=0,locked=false,tick;
    const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),norm=s=>String(s).trim().replace(/\s/g,'').toLowerCase();
    $('best').textContent=(+localStorage.getItem('stock-rush-best-hard')||0).toLocaleString();
    function makeQuestions(){const cfg=levels[level];return shuffle(stocks).slice(0,5).map((s,i)=>{const askCode=(level+i)%2===0;const ans=askCode?s[0]:(level>=3?s[2]:s[1]);let pool=stocks.filter(x=>x[0]!==s[0]&&(!cfg.same||x[3]===s[3]));if(pool.length<3)pool=stocks.filter(x=>x[0]!==s[0]);const others=shuffle(pool).slice(0,3).map(x=>askCode?x[0]:(level>=3?x[2]:x[1]));return{s,askCode,ans,choices:shuffle([ans,...others])}})}
    function startGame(){score=combo=total=0;level=0;$('welcome').classList.add('hide');$('game').classList.remove('hide');startLevel()}
    function startLevel(){questions=makeQuestions();qi=correct=0;time=levels[level].time;locked=false;$('result').classList.add('hide');$('play').classList.remove('hide');renderLevels();renderMeta();renderQuestion();runTimer()}
    function renderLevels(){$('levels').innerHTML=levels.map((x,i)=>`<div class="node ${i<level?'done':''} ${i===level?'active':''}"><i>${i<level?'✓':i+1}</i><small>${x.mode}</small></div>`).join('')}
    function renderMeta(){const cfg=levels[level];$('levelTag').textContent=`LEVEL ${String(level+1).padStart(2,'0')} · ${cfg.mode}`;$('levelTitle').textContent=cfg.name;renderTime()}
    function renderTime(){$('time').textContent=time;$('bar').style.width=(time/levels[level].time*100)+'%';$('timer').classList.toggle('danger',time<=7)}
    function runTimer(){clearInterval(tick);tick=setInterval(()=>{if(locked)return;if(--time<=0){time=0;clearInterval(tick);finish(false,'時間到')}renderTime()},1000)}
    function renderQuestion(){locked=false;const cfg=levels[level],q=questions[qi];$('qnum').textContent=`第 ${qi+1} 題`;$('target').textContent=`本關答對 ${correct} / ${cfg.need}`;$('instruction').textContent=q.askCode?'這家公司的股票代號是？':'這個股票代號是哪家公司？';$('prompt').textContent=q.askCode?q.s[1]:q.s[0];$('industry').textContent=cfg.hint?q.s[3]+'類股':(cfg.same?'同業干擾・不給提示':'不給提示');$('reveal').classList.add('hide');$('reveal').textContent='';$('answers').innerHTML=cfg.input?`<form class="typing" onsubmit="event.preventDefault();answer(this.guess.value)"><input name="guess" autocomplete="off" inputmode="${q.askCode?'numeric':'text'}" placeholder="${q.askCode?'輸入 4 碼股號':'輸入公司名'}" aria-label="輸入答案"><button class="primary">送出</button></form>`:q.choices.map((x,i)=>`<button onclick="answer('${x.replaceAll("'","\\'")}')"><kbd>${i+1}</kbd><span>${x}</span><i></i></button>`).join('');if(cfg.input)setTimeout(()=>$('answers').querySelector('input')?.focus(),30);$('combo').textContent='×'+combo;$('score').textContent=score.toLocaleString()}
    function answer(choice){if(locked)return;locked=true;const cfg=levels[level],q=questions[qi],ok=norm(choice)===norm(q.ans)||(!q.askCode&&(norm(choice)===norm(q.s[1])||norm(choice)===norm(q.s[2])));if(cfg.input){const input=$('answers').querySelector('input'),btn=$('answers').querySelector('button');if(input)input.disabled=true;if(btn)btn.disabled=true;$('reveal').textContent=ok?'答對！':`答案：${q.ans}`;$('reveal').classList.remove('hide')}else{[...$('answers').children].forEach(b=>{b.disabled=true;const txt=b.querySelector('span').textContent;if(txt===q.ans){b.classList.add('correct');b.querySelector('i').textContent='✓'}else if(txt===choice){b.classList.add('wrong');b.querySelector('i').textContent='×'}})}if(ok){combo++;correct++;total++;score+=120+Math.min(combo-1,6)*25+time*3+(cfg.input?80:0)}else{combo=0;time=Math.max(0,time-cfg.penalty);renderTime()}$('combo').textContent='×'+combo;$('score').textContent=score.toLocaleString();setTimeout(()=>{if(qi===4){clearInterval(tick);correct>=cfg.need?(level===4?finish(true):levelUp()):finish(false,'挑戰結束')}else{qi++;if(cfg.input){time=cfg.time;renderTime();runTimer()}renderQuestion()}},cfg.input?960:760)}
    function levelUp(){$('play').classList.add('hide');$('result').classList.remove('hide');$('result').innerHTML=`<div class="icon">✦</div><span class="tag">闖關成功</span><h2>${levels[level].name}，突破！</h2><p>本關答對 ${correct} 題，下一關：${levels[level+1].mode}。</p><button class="primary" onclick="level++;startLevel()">挑戰下一關　→</button>`}
    function finish(won,label='全數過關'){clearInterval(tick);const best=+localStorage.getItem('stock-rush-best-hard')||0;if(score>best){localStorage.setItem('stock-rush-best-hard',score);$('best').textContent=score.toLocaleString()}const rank=score>=7600?'台股傳奇':score>=5200?'王牌操盤手':score>=3000?'看盤高手':'市場新鮮人';$('play').classList.add('hide');$('result').classList.remove('hide');$('result').innerHTML=`<div class="icon">${won?'🏆':'?'}</div><span class="tag">${label}</span><h2>${won?'你征服了高難度台股代號！':'差一點，再來一盤'}</h2><p>稱號：<b>${rank}</b></p><div class="stats"><span><b>${score.toLocaleString()}</b>總分</span><span><b>${total}</b>答對題數</span><span><b>${level+(won?1:0)}</b>突破關卡</span></div><button class="primary" onclick="startGame()">↻　再玩一次</button>`}
    addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('welcome').classList.contains('hide'))startGame();if(!levels[level]?.input&&!locked&&e.key>='1'&&e.key<='4'&&!$('play').classList.contains('hide')){const q=questions[qi];if(q)answer(q.choices[+e.key-1])}})
  </script>
</body>
</html>
